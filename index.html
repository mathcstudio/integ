<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정적분 등반</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 열짜리 등산로(정상이 위). 문제 화면은 넓은 태블릿(가로)에서 문제·풀이 / 입력 두 열로 나뉜다. */
:root {
  --paper: #EEF3F4; --contour: #DCE6E8; --ink: #13262B; --muted: #55696F; --surface: #FFFFFF; --line: #BFCED2;
  --accent: #0F6B78; --on-accent: #FFFFFF; --flag: #D2541B; --good: #1B7F4A; --good-soft: #DDF3E6;
  --bad: #C0352F; --bad-soft: #FBE3E1; --band: #12262B; --on-band: #EAF2F4; --rock1: #7C959B; --rock2: #4E666C;
  --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --hand: "Nanum Pen Script", "Noto Sans KR", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1A1E; --contour: #15272C; --ink: #E6F0F2; --muted: #98AEB4; --surface: #152429; --line: #2B4148;
    --accent: #5CC4D3; --on-accent: #0D1A1E; --flag: #F08A4B; --good: #5FD08F; --good-soft: #173626;
    --bad: #F0827B; --bad-soft: #3B1C1B; --band: #081215; --on-band: #E6F0F2; --rock1: #3D555C; --rock2: #26393F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1A1E; --contour: #15272C; --ink: #E6F0F2; --muted: #98AEB4; --surface: #152429; --line: #2B4148;
  --accent: #5CC4D3; --on-accent: #0D1A1E; --flag: #F08A4B; --good: #5FD08F; --good-soft: #173626;
  --bad: #F0827B; --bad-soft: #3B1C1B; --band: #081215; --on-band: #E6F0F2; --rock1: #3D555C; --rock2: #26393F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background-color: var(--paper);
  background-image: repeating-radial-gradient(ellipse 120% 80% at 50% 0%, transparent 0 46px, var(--contour) 46px 48px);
  color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
.wrap {
  max-width: 780px; margin: 0 auto; padding-block: 16px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.wrap.wide { max-width: 1180px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(30px, 7vw, 46px); }
h1 span { color: var(--accent); }
h2 { font-size: 24px; }
.btn { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 18px; font-weight: 700; font-size: 17px; min-height: 50px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { font-size: 15px; padding: 6px 14px; min-height: 44px; font-weight: 500; }
.btn:disabled { opacity: .55; cursor: default; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }

/* 상단 바 */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.bar .who { font-weight: 700; }
.bar .total { font-family: var(--display); font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.bar .right { display: flex; align-items: center; gap: 10px; }
.sync { font-size: 12px; color: var(--muted); }
.sync.bad { color: var(--bad); font-weight: 700; }

/* 등산로 */
.trail { display: flex; flex-direction: column; }
.camp { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding-bottom: 18px; }
.camp::before { content: ""; position: absolute; left: 31px; top: 34px; bottom: -4px; border-left: 3px dashed var(--line); }
.camp:last-child::before { display: none; }
.camp.passed::before { border-left: 3px solid var(--accent); }
.alt { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.peg { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); display: grid; place-items: center; font-size: 15px; font-weight: 700; }
.camp.open .peg { border-color: var(--flag); color: var(--flag); }
.camp.passed .peg { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.alt small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; background: var(--paper); padding: 0 2px; }
.camp-body { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.camp.open .camp-body { border-color: var(--flag); }
.camp.locked .camp-body { opacity: .6; }
.camp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.camp-head .nm { font-family: var(--display); font-size: 21px; }
.camp-head .tp { font-weight: 700; color: var(--accent); margin-left: 8px; font-size: 16px; }
.camp-head .st { font-size: 14px; font-weight: 700; color: var(--muted); }
.camp.open .st { color: var(--flag); } .camp.passed .st { color: var(--good); }
.tip { margin: 0; font-size: 15px; color: var(--muted); }
.ex { font-size: 15px; background: var(--paper); border-radius: 10px; padding: 6px 12px; overflow-x: auto; }
.ex b { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin-right: 8px; }
.tier { display: flex; flex-direction: column; gap: 6px; }
.tier-head { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.tier-head .ok { color: var(--good); }
.routes { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.route { border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); padding: 8px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 62px; }
.route b { font-size: 16px; }
.route span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.route.done { background: var(--good-soft); border-color: var(--good); }
.route.done span { color: var(--good); font-weight: 700; }
.route.going { border-color: var(--flag); }
.route.essay b::after { content: " ✎"; }
.banner { background: var(--accent); color: var(--on-accent); border-radius: 14px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.banner b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.banner .btn { border-color: transparent; color: var(--ink); }

/* 문제 화면 */
.prob { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 960px) { .prob { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.q { font-size: clamp(19px, 3.2vw, 27px); text-align: center; padding: 14px 4px; overflow-x: auto; line-height: 2; word-break: keep-all; }
.q.text { text-align: left; font-size: clamp(17px, 2.4vw, 21px); }
.meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 700; color: var(--muted); }
.meta .miss { color: var(--bad); }
.log { display: flex; flex-direction: column; gap: 6px; border-top: 1.5px dashed var(--line); padding-top: 12px; }
.log h3, .now h3 { font-size: 13px; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 700; }
.logline { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; align-items: center; background: var(--good-soft); border-radius: 8px; padding: 6px 10px; overflow-x: auto; font-size: 16px; }
.logline i { font-style: normal; font-weight: 700; color: var(--good); }
.logline.new { animation: pop .45s ease-out; }
.essay-log { white-space: pre-wrap; word-break: break-word; }
.now { display: flex; flex-direction: column; gap: 12px; }
.now-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tries { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
.tries i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); display: inline-block; }
.tries i.used { background: transparent; border: 2px solid var(--line); }
.prompt { margin: 0; font-weight: 700; font-size: 17px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.opt { border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 14px; min-height: 68px; font-size: 17px; overflow-x: auto; text-align: center; }
.opt.t { text-align: left; font-size: 16px; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); opacity: .7; }
.fields { display: flex; flex-wrap: wrap; gap: 10px; }
.field { flex: 1 1 200px; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 8px 12px; min-height: 60px; text-align: left; }
.field .val { font-size: 22px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; min-height: 1.4em; }
.field.active { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.field.ok { border-color: var(--good); background: var(--good-soft); }
.field.no { border-color: var(--bad); background: var(--bad-soft); }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 440px; width: 100%; margin: 0 auto; }
.key { border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 23px; font-weight: 700; min-height: 58px; }
.key:active { background: var(--paper); }
.key.go { grid-column: span 3; background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 18px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
.fb { margin: 0; font-weight: 700; min-height: 1.5em; }
.fb.no { color: var(--bad); } .fb.ok { color: var(--good); }
.wait { margin: 0; font-size: 15px; font-weight: 700; color: var(--flag); font-variant-numeric: tabular-nums; }
.wait:empty { display: none; }
.opt:disabled, .key:disabled { opacity: .55; cursor: default; }
.hintbox { border-left: 4px solid var(--flag); background: var(--paper); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 15px; overflow-x: auto; }
.hintbox b { display: block; font-size: 13px; letter-spacing: .08em; color: var(--flag); }
.hintbox p { margin: 2px 0 0; }
.hintbox p + p { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.done-box { background: var(--good-soft); border: 1.5px solid var(--good); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; animation: pop .5s ease-out; }
.done-box p { margin: 0; }
.done-box .route { background: var(--surface); }
.route:disabled { opacity: .5; cursor: default; }
.done-box > b { font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--good); }
.fail-box { background: var(--bad-soft); border: 1.5px solid var(--bad); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.fail-box > b { font-family: var(--display); font-weight: 400; font-size: 21px; color: var(--bad); }
.fail-box p { margin: 0; }
.fail-box .row { display: flex; gap: 10px; flex-wrap: wrap; }
.essay-f { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
.essay-f textarea { width: 100%; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 14px; min-height: 64px; resize: vertical; line-height: 1.6; font-size: 17px; font-weight: 400; color: var(--ink); }
.essay-f textarea:focus { border-color: var(--accent); outline: none; }
.symbols { display: flex; flex-wrap: wrap; gap: 6px; }
.symbols button { border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 48px; min-height: 46px; font-size: 18px; font-weight: 700; }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes pop { 0% { transform: scale(.94); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }

/* 등반 기록 */
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.sum div { background: var(--paper); border-radius: 10px; padding: 10px 12px; }
.sum small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.sum b { font-family: var(--display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.rec { display: flex; flex-direction: column; gap: 8px; border-top: 1.5px solid var(--line); padding-top: 14px; }
.rec-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 700; }
.rec-head span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rec .q { font-size: 17px; padding: 4px; text-align: left; line-height: 1.9; }
.empty { color: var(--muted); margin: 0; }

/* 축하 장면 */
.cele { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow: hidden; background-color: var(--surface);
  background-image: linear-gradient(var(--contour) 1px, transparent 1px), linear-gradient(90deg, var(--contour) 1px, transparent 1px); background-size: 28px 28px;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fadein .35s ease-out; }
.cele canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cele-in { position: relative; width: min(560px, 100%); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.cele svg { width: 100%; height: auto; max-height: 46vh; display: block; }
.cele .kicker { font-size: 14px; font-weight: 700; letter-spacing: .14em; color: var(--accent); margin: 0; }
.cele h2 { font-size: clamp(34px, 8vw, 56px); animation: rise .6s .9s both cubic-bezier(.2, .9, .3, 1.3); }
.cele .altnum { font-family: var(--display); font-size: clamp(26px, 6vw, 40px); color: var(--flag); font-variant-numeric: tabular-nums; margin: 0; line-height: 1.1; }
.cele .sub { margin: 0; color: var(--muted); font-size: 16px; animation: rise .5s 1.3s both; }
.cele .btn { margin-top: 6px; min-width: 200px; animation: rise .5s 1.6s both; }
@keyframes rise { from { transform: translateY(18px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .cele, .cele h2, .cele .sub, .cele .btn, .done-box, .logline.new, .shake { animation: none; }
  .cv-climber, .cv-strip, .tour-ring, .tour-box { transition: none; } .quake { animation: none; }
}

/* 개념 정리 팝업 */
.note { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(8, 20, 24, .66); overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fadein .25s ease-out; }
.note-in { width: min(620px, 100%); background: var(--surface); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px; border-top: 8px solid var(--flag); animation: pop .4s ease-out; }
.note-in .kicker { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--flag); }
.note-in .say { margin: 0; font-size: 18px; font-weight: 700; word-break: keep-all; }
.formula { background: var(--paper); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; overflow-x: auto; font-size: 18px; line-height: 2; }
.memo { margin: 0; background: var(--paper); border-left: 4px solid var(--flag); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 16px; }
.note-in .chk { display: flex; align-items: center; gap: 10px; font-weight: 700; min-height: 48px; }
.note-in .chk input { width: 24px; height: 24px; accent-color: var(--accent); }
/* 마지막 관문 */
.gate { display: flex; flex-direction: column; gap: 14px; }
.gate-item { display: flex; flex-direction: column; gap: 10px; }
.gate-item.ok { border-color: var(--good); background: var(--good-soft); }
.gate-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 700; }
.gate-head .ok { color: var(--good); }
.blanks { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.blanks label { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.blanks input { width: 96px; min-height: 50px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 6px 12px; font-size: 20px; text-align: center; }
.blanks input:focus { border-color: var(--accent); outline: none; }
.blanks input.no { border-color: var(--bad); background: var(--bad-soft); }
/* 관리자 */
.admin { display: flex; flex-direction: column; gap: 14px; }
.admin .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.admin input[type=password] { flex: 1 1 200px; min-width: 0; min-height: 50px; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--surface); font-size: 17px; }
.admin .note-line { margin: 0; color: var(--muted); font-size: 14px; }
.admin .err { margin: 0; color: var(--bad); font-weight: 700; min-height: 1.5em; }
.tbl-wrap { overflow-x: auto; border: 1.5px solid var(--line); border-radius: 12px; }
table.rate { border-collapse: collapse; width: 100%; min-width: 720px; font-variant-numeric: tabular-nums; }
table.rate th, table.rate td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--line); font-size: 15px; }
table.rate thead th { font-size: 13px; color: var(--muted); background: var(--paper); line-height: 1.3; }
table.rate thead th small { display: block; font-weight: 400; }
table.rate tbody th { text-align: left; white-space: nowrap; }
table.rate tbody th button { border: 0; background: none; font-weight: 700; padding: 6px 0; min-height: 40px; text-decoration: underline; text-underline-offset: 3px; }
table.rate td b { display: block; font-size: 17px; }
table.rate td small { color: var(--muted); font-size: 12px; }
table.rate tr.tot th, table.rate tr.tot td { border-top: 2px solid var(--ink); border-bottom: 0; font-weight: 700; }
table.rate tr.sel th { box-shadow: inset 4px 0 0 var(--flag); }
table.list { border-collapse: collapse; width: 100%; min-width: 520px; font-variant-numeric: tabular-nums; }
table.list th, table.list td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); font-size: 15px; }
table.list th { font-size: 13px; color: var(--muted); background: var(--paper); }
@media (prefers-reduced-motion: reduce) { .note, .note-in { animation: none; } }

/* 서술길 쓰는 법 */
table.how { border-collapse: collapse; width: 100%; }
table.how th, table.how td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 16px; }
table.how th { font-size: 14px; color: var(--muted); white-space: nowrap; }
kbd { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
/* 관리자: 서술 답안 */
table.list tr.sel td { background: var(--paper); }
.essays { display: flex; flex-direction: column; gap: 12px; }
.essay-card { border: 1.5px solid var(--line); border-left: 6px solid var(--bad); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.essay-card.ok { border-left-color: var(--good); }
.essay-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); }
.essay-head b { color: var(--ink); font-size: 16px; }
.badge { font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); }
.badge.ok { background: var(--good-soft); color: var(--good); }
.essay-card .q { font-size: 17px; padding: 0; text-align: left; line-height: 1.8; }
.essay-card .essay-log { background: var(--paper); border-radius: 10px; padding: 10px 12px; font-size: 16px; }

/* 첫 화면: 곡선을 오르는 산 */
.wrap.intro-view { padding-block: 0; max-width: 820px; gap: 0; }
.hero { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  background-color: var(--surface); background-image: linear-gradient(var(--contour) 1px, transparent 1px), linear-gradient(90deg, var(--contour) 1px, transparent 1px); background-size: 28px 28px; }
.hero-top { padding: clamp(20px, 5vh, 44px) clamp(20px, 5vw, 44px) 0; }
.hero-top .kick { margin: 0; font-family: var(--hand); font-size: clamp(22px, 4.2vw, 32px); color: var(--flag); line-height: 1; }
.hero-top h1 { font-size: clamp(48px, 12vw, 96px); line-height: 1; margin-top: 6px; }
.hero-art { flex: 1 1 auto; display: flex; align-items: flex-end; min-height: 0; padding-inline: clamp(0px, 2vw, 20px); }
.hero-art svg { width: 100%; height: auto; max-height: 56vh; display: block; overflow: visible; }
.hero-form { background: var(--band); color: var(--on-band); padding: 20px clamp(20px, 5vw, 44px) max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.hero-form .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.who-f { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 700; flex: 0 1 150px; min-width: 110px; }
.who-f.grow { flex: 1 1 180px; }
.hero-form input { width: 100%; min-width: 0; border: 0; border-radius: 12px; padding: 10px 14px; background: #FFFFFF; color: #12262B; font-size: 18px; font-weight: 400; min-height: 54px; }
.hero-form input::placeholder { color: #8A9BA0; }
.hero-form input:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
.btn.start { background: var(--flag); border-color: var(--flag); color: #FFFFFF; min-height: 54px; font-size: 19px; padding-inline: 26px; flex: 0 0 auto; }
.hero-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
.hero-foot .err { margin: 0; color: #FFB4A0; font-weight: 700; }
.link { background: none; border: 0; color: var(--on-band); opacity: .7; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; min-height: 44px; padding: 0 4px; }
/* 산 그림 */
.cv-strip { fill: var(--paper); stroke: var(--surface); stroke-width: 2; transition: fill .8s ease; }
.cv-strip.on { fill: var(--c); }
.cv-line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.cv-axis { stroke: var(--ink); stroke-width: 2; }
.cv-x { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 13px; fill: var(--ink); text-anchor: middle; }
.cv-name { font-family: var(--body); font-weight: 700; fill: var(--muted); text-anchor: middle; }
.cv-name.dark { fill: #FFFFFF; } .cv-name.light { fill: #12262B; }
.cv-dot { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.cv-pole { stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
.cv-flag { fill: var(--flag); }
.cv-hand { font-family: var(--hand); font-size: 17px; fill: var(--flag); text-anchor: end; }
.cv-climber { transition: transform 1.3s cubic-bezier(.45, .05, .3, 1); }
.cv-climber .head { fill: var(--flag); }
.cv-climber .body { stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.cv-climber .stick { stroke: var(--ink); stroke-width: 1.6; }
.tiers { display: flex; flex-direction: column; gap: 10px; }
/* 밝게 비추는 안내 */
.tour { position: fixed; inset: 0; z-index: 55; }
.tour-ring { position: fixed; border-radius: 14px; box-shadow: 0 0 0 200vmax rgba(8, 20, 24, .76); outline: 3px solid #F2B705; outline-offset: 3px; pointer-events: none; transition: left .4s, top .4s, width .4s, height .4s; }
.tour-box { position: fixed; background: var(--surface); color: var(--ink); border-radius: 14px; border-top: 6px solid var(--flag); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; transition: top .4s, left .4s; }
.tour-box .n { font-family: var(--display); font-weight: 400; color: var(--flag); font-size: 15px; }
.tour-box p { margin: 0; font-size: 17px; line-height: 1.55; word-break: keep-all; }
.tour-box .btns { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tour-box button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; min-height: 46px; padding: 0 18px; }
.tour-box .next { background: var(--accent); color: var(--on-accent); }
.tour-box .prev, .tour-box .skip { background: transparent; color: var(--muted); padding-inline: 8px; }

/* 산사태 장면 */
.cele.slide .kicker { color: var(--bad); }
.cele.slide h2 { color: var(--bad); animation-delay: .2s; }
.cele.slide .sub { animation-delay: 2.1s; max-width: 30em; }
.cele.slide .btn { animation-delay: 2.5s; }
.rock { fill: var(--rock2); stroke: var(--ink); stroke-width: 1; opacity: 0; }
.rock.dust { fill: var(--rock1); stroke: none; }
.quake { animation: quake .16s linear infinite; }

.note-in .row { display: flex; gap: 10px; flex-wrap: wrap; }
.pickbox { width: 24px; height: 24px; accent-color: var(--accent); }
.admin .okmsg { color: var(--good); font-weight: 700; }

/* 서술길: 기회를 다 쓴 뒤의 선택과 선생님 확인 요청 */
.essay-log.mine { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 16px; }

.reviews h2 { color: var(--flag); }
.essay-card.rv { border-left-color: var(--flag); }
.essay-card .row { display: flex; gap: 8px; flex-wrap: wrap; }

<script>
(function () {

  /* 서버 설정의 기본값. limC = 선택형 기회, limN = 입력형 기회(없으면 서술형과 같게), limE = 서술형 기회,

  norm();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  function freshUi() { return { order: null, vals: [], active: 0, ok: [], no: [], fb: null, busy: false, focus: 0, fresh: false }; }

  var adm = freshAdm(), gateFb = {};

  /* ---------- 도우미 ---------- */
  function parse(s) {
    var m = /^(-?\d+)(?:\/(\d+))?$/.exec(String(s).trim());
    if (!m) return null;
    var d = m[2] ? +m[2] : 1; if (!d) return null;
    return [+m[1], d];
  }
  function same(a, b) { var x = parse(a), y = parse(b); return !!x && !!y && x[0] * y[1] === y[0] * x[1]; }
  function texNum(s) { var x = parse(s); if (!x) return s; return x[1] === 1 ? String(x[0]) : (x[0] < 0 ? "-" : "") + "\\tfrac{" + Math.abs(x[0]) + "}{" + x[1] + "}"; }
  function st(id) {
    var s = S.probs[id] || (S.probs[id] = { step: 0, miss: 0, done: false, score: 0, log: [] });

  }
  function isDone(p) { return !!(S.probs[p.id] && S.probs[p.id].done); }
  /* 구간의 길 묶음. 순서대로 열리고, 묶음마다 하나씩 완등해야 구간을 통과한다.
     서술길은 서버에 채점 설정(API 키)이 있을 때만 생긴다. */
  function stages(c) {

      { label: "중간 길", list: c.probs.filter(function (p) { return p.idx >= 2 && !p.essay; }) }];
    var es = c.probs.filter(function (p) { return p.essay; });
    if (es.length && (CFG.essayOn || es.some(isDone))) out.push({ label: "서술길", list: es });
    return out;
  }
  function stageDone(st) { return st.list.some(isDone); }
  function stageOpen(c, k) { return c.bonus || k === 0 || stageDone(stages(c)[k - 1]); }
  function stageOf(p) {
    var sts = stages(CAMPS[p.camp]);
    for (var k = 0; k < sts.length; k++) if (sts[k].list.indexOf(p) >= 0) return sts[k];
    return null;
  }
  function probOpen(p) {
    var c = CAMPS[p.camp], sts = stages(c);
    for (var k = 0; k < sts.length; k++) if (sts[k].list.indexOf(p) >= 0) return unlocked(p.camp) && stageOpen(c, k);

  function logHtml(s, markNew) {

  /* 틀렸을 때 답을 알려 주는 대신, 스스로 확인할 방법을 묻는다 */

  /* 서술길에서 기회를 다 쓰면: 오답을 인정하고 다시 시작하거나, 선생님께 확인을 요청한다 */
  function failCost(p) {

  function nextHtml(p, s) {

    } else h += "<p>" + (c.bonus ? "보너스 봉우리에 올랐습니다. 남은 길에도 도전해 보세요." : "이 구간을 통과했습니다.") + "</p>";

  function vProb() {

  function vRecord() {

  /* ---------- 마지막 관문: 개념 빈칸 ---------- */
  var BL = ["(가)", "(나)"];
  function vFinal() {

      for (var di = 0; di < limN(); di++) dots += '<i class="' + (di < limN() - tr ? "" : "used") + '"></i>';

  function normBlank(v) { return String(v || "").trim().toLowerCase().replace(/[−–—ㅡ]/g, "-").replace(/＋/g, "+").replace(/\s/g, ""); }
  function checkGate(key) {
    if (lockLeft()) return;
    var f = S.final, n = NOTES[key], vals = f.vals[key] || [], bad = [], anyBad = false, empty = false;
    n.blanks.forEach(function (acc, i) { var v = normBlank(vals[i]); if (!v) empty = true; bad[i] = acc.indexOf(v) < 0; if (bad[i]) anyBad = true; });
    if (empty) { gateFb[key] = { msg: "빈칸을 모두 채운 뒤 확인을 누르세요.", bad: [] }; render(); return; }
    if (!anyBad) {
      f.ok[key] = true; delete gateFb[key]; dirty = true;
      if (Object.keys(f.ok).length >= SUMMIT + 1) {
        f.done = true; if (!S.end) S.end = Date.now();

        render(); setTimeout(function () { celebrate(SUMMIT); }, calm ? 0 : 400); return;
      }
      save(); render(); return;
    }
    f.miss++; f.tries[key] = (f.tries[key] || 0) + 1; dirty = true; startLock();
    f.msk = f.msk || {}; f.msk[key] = (f.msk[key] || 0) + 1;
    if (f.tries[key] >= limN()) {
      f.tries[key] = 0; f.vals[key] = []; delete gateFb[key]; save(); render();
      showNote(BYKEY[key], true); return;

    save(); render();
  }

  function showEssayTip() {

      if (!parse(ui.vals[ui.active])) { ui.fb = ["no", "입력 형식을 확인하세요. 예: 4/3, -4"]; render(); return; }

    }
    advance(p, s, { k: "m", v: step.full || step.f.map(function (f) { return f[0] + " = " + texNum(f[1]); }).join(",\\quad ") });
  }
  function pressKey(k) {
    var p = BYID[S.cur]; if (!p) return; var s = st(p.id); if (s.done || s.fail) return;
    var step = p.steps[s.step]; if (step.t !== "nums") return;
    if (k === "go") return checkNums();
    var i = ui.active;
    if (ui.ok[i]) { i = -1; step.f.forEach(function (_, j) { if (i < 0 && !ui.ok[j]) i = j; }); if (i < 0) return; ui.active = i; }
    var v = ui.vals[i] || "";
    if (ui.no[i]) { ui.no[i] = false; if (k !== "⌫") v = ""; }
    if (k === "⌫") v = v.slice(0, -1);
    else if (k === "-") v = v.charAt(0) === "-" ? v.slice(1) : "-" + v;
    else if (k === "/") { if (v && v !== "-" && v.indexOf("/") < 0) v += "/"; }
    else if (v.length < 8) v += k;
    ui.vals[i] = v; ui.fb = null; render();
  }
  function submitEssay() {
    if (lockLeft()) return;
    var p = BYID[S.cur], s = st(p.id), step = p.steps[s.step], d = step.f.map(function (_, i) { return String(s.draft[i] || "").trim(); });
    if (d.some(function (x) { return !x; })) { ui.fb = ["no", "모든 칸에 풀이를 써 주세요. 빈칸이 있으면 채점받을 수 없습니다."]; render(); return; }
    var text = d.map(function (x, i) { return MARK[i] + " [" + step.f[i][0] + "] " + x; }).join("\n"), id = p.id;
    ui.busy = true; ui.fb = null; render();
    call("apiGrade", { name: S.name, id: id, text: text }).then(function (r) {
      if (S.cur !== id || S.view !== "prob") { ui.busy = false; return; }
      ui.busy = false;
      if (!r || !r.ok) { ui.fb = ["no", "채점하지 못했습니다(기회는 줄지 않습니다). " + esc((r && r.error) || "") + " 선생님께 알려 주세요."]; render(); return; }
      if (r.correct) advance(p, s, { k: "e", v: text });
      else { s.ai = String(r.hint || ""); s.sub = text; missed("아직 정답으로 인정되지 않았습니다. 아래 도움말을 읽고 풀이를 고쳐 다시 제출하세요."); }
    }).catch(function () {
      ui.busy = false; ui.fb = ["no", "채점하지 못했습니다(기회는 줄지 않습니다). 인터넷 연결을 확인하고 다시 눌러 주세요."]; render();
    });
  }

  /* ---------- 입장 ---------- */
  function join() {
    var sid = document.getElementById("idInput").value.replace(/\D/g, ""), sname = document.getElementById("nameInput").value.replace(/\s+/g, " ").trim();
    S.sid = sid; S.sname = sname;
    if (!sid) { joinErr = "학번을 숫자로 입력하세요."; render(); return; }
    if (sname.length < 2) { joinErr = "이름을 입력하세요."; render(); return; }
    var name = sid + " " + sname;
    joining = true; joinErr = ""; if (S.name !== name) { S = fresh(name); S.sid = sid; S.sname = sname; } render();
    var req = HAS ? call("apiJoin", name) : Promise.resolve({ ok: true, name: name, demo: true, state: null, cfg: CFG });
    req.then(function (r) {
      if (!r || !r.ok) throw new Error("join");
      CFG = withDefaults(r.cfg);
      var server = null; try { server = r.state ? JSON.parse(r.state) : null; } catch (e) {}
      var local = S, push = false;
      if (!r.demo) {
        if (server && (server.rev || 0) >= (local.rev || 0)) S = server;          /* 다른 기기에서 이어 하기 */
        else if (!server && local.synced) S = fresh(r.name);                      /* 선생님이 기록을 지운 경우 */
        else push = local.rev > 0;                                                /* 이 기기의 기록이 더 새로움 */
      }
      S.name = r.name; S.sid = sid; S.sname = sname; norm(); joining = false;
      var first = !S.start; if (first) S.start = Date.now();
      S.view = "map"; save(); ui = freshUi(); render(); window.scrollTo(0, 0);
      if (first) { queueSave(); celebrate("start"); } else if (push || S.outbox.length) queueSave();
      else { var el = app.querySelector(".camp.open"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "center" }); }
      if (!first) { checkNote(); maybeTour(); rvPoll(false); }            /* 밀린 핵심 정리와 아직 못 본 안내를 차례로 */
    }).catch(function () { joining = false; joinErr = "접속하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요."; render(); });
  }

  /* ---------- 입력 ---------- */
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    var d = b.dataset;
    if (d.act === "start") join();
    else if (d.act === "admin") { adm.err = ""; S.view = "admin"; render(); window.scrollTo(0, 0); }
    else if (d.act === "adminExit") { adm = freshAdm(); S.view = "intro"; render(); }
    else if (d.stu) { adm.stu = adm.stu === d.stu ? null : d.stu; render(); var ep = document.getElementById("essayPanel"); if (ep && ep.scrollIntoView) ep.scrollIntoView({ block: "nearest" }); }
    else if (d.act === "adminLogin") { var pw = document.getElementById("adminPw").value; if (!pw) { adm.err = "비밀번호를 입력하세요."; render(); } else adminLoad(pw); }
    else if (d.act === "adminRefresh") adminLoad(adm.pw);
    else if (d.act === "adminSort") { adm.byBad = !adm.byBad; render(); }
    else if (d.rvid) adminReview(d.rvwho, d.rvid, d.rvok === "1");
    else if (d.act === "adminDelAll") confirmDelete([], true);
    else if (d.act === "adminDelSel") { var picked = Object.keys(adm.sel).filter(function (k) { return adm.sel[k] && adm.data.some(function (x) { return x.sid + " " + x.name === k; }); }); if (picked.length) confirmDelete(picked, false); }
    else if (d.cls) { adm.open = adm.open === d.cls ? null : d.cls; adm.stu = null; adm.sel = {}; adm.msg = ""; render(); }
    else if (d.act === "final") go("final");
    else if (d.gate) checkGate(d.gate);
    else if (d.act === "map") go("map");
    else if (d.act === "record") go("record");
    else if (d.act === "restart") restart();
    else if (d.act === "rvAsk") rvAsk();
    else if (d.act === "rvAccept") rvAccept();
    else if (d.act === "rvPoll") rvPoll(true);
    else if (d.act === "hint") { var hs = st(S.cur); hs.hintOpen = true; hs.hints = (hs.hints || 0) + 1; dirty = true; save(); render(); }
    else if (d.ex != null) { exOpen[d.ex] = true; render(); }
    else if (d.act === "grade") submitEssay();
    else if (d.sym) {
      var ta = document.getElementById("essay" + ui.focus), a = ta.selectionStart, z = ta.selectionEnd, ins = d.sym.replace(" ", "");
      ta.value = ta.value.slice(0, a) + ins + ta.value.slice(z); st(S.cur).draft[ui.focus] = ta.value; save();
      ta.focus(); ta.selectionStart = ta.selectionEnd = a + (ins.length === 2 ? 1 : ins.length);
    }
    else if (d.prob) {
      var np = BYID[d.prob]; if (!np || (!probOpen(np) && !isDone(np))) return;
      st(d.prob); go("prob", d.prob);
      if (np.essay && !S.tipEssay && !isDone(np)) showEssayTip();
    }
    else if (d.opt != null) pickOpt(+d.opt);
    else if (d.field != null) { if (!ui.ok[+d.field]) { ui.active = +d.field; render(); } }
    else if (d.key) pressKey(d.key);
  });
  app.addEventListener("change", function (e) {
    var w = e.target.dataset && e.target.dataset.sel; if (!w) return;
    adm.sel[w] = e.target.checked; adm.msg = ""; render();
  });
  app.addEventListener("input", function (e) {
    var i = e.target.dataset.essay; if (i != null) { st(S.cur).draft[+i] = e.target.value; save(); }
    var b = e.target.dataset.blank; if (b) { var kv = b.split(":"); (S.final.vals[kv[0]] = S.final.vals[kv[0]] || [])[+kv[1]] = e.target.value; e.target.classList.remove("no"); save(); }
  });
  app.addEventListener("focusin", function (e) {
    var i = e.target.dataset && e.target.dataset.essay; if (i == null) return;
    ui.focus = +i;
    setTimeout(function () { if (e.target.isConnected && e.target.scrollIntoView) e.target.scrollIntoView({ block: "center", behavior: calm ? "auto" : "smooth" }); }, 350);   /* 화면 키보드가 올라온 뒤 */
  });
  document.addEventListener("keydown", function (e) {
    if (document.querySelector(".cele, .note, .tour")) return;
    if (e.target.tagName === "TEXTAREA") return;
    if (S.view === "admin") { if (e.key === "Enter" && e.target.id === "adminPw") { var lb = app.querySelector("[data-act=adminLogin]"); if (lb) lb.click(); } return; }
    if (S.view === "final") { if (e.key === "Enter" && e.target.dataset.blank) checkGate(e.target.dataset.blank.split(":")[0]); return; }
    if (S.view === "intro") { if (e.key === "Enter" && !joining) join(); return; }
    if (S.view !== "prob" || e.target.tagName === "INPUT") return;
    if (/^[0-9]$/.test(e.key) || e.key === "-" || e.key === "/") { pressKey(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { pressKey("⌫"); e.preventDefault(); }
    else if (e.key === "Enter" && !e.target.closest("button")) pressKey("go");
  });
  window.addEventListener("pagehide", function () { if (dirty) queueSave(); });

  render();
})();

</script>
